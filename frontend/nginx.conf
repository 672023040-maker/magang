# Edge server: menyajikan SPA hasil build, meneruskan request PHP ke php-fpm.
#
# PENTING: header Content-Security-Policy di sini HARUS selaras dengan
# App\Http\Middleware\SecurityHeaders. Header diletakkan pada dokumen HTML
# (location = /index.html) saja agar tidak dobel dengan header yang sudah
# dikirim Laravel untuk respons API.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Batas ukuran upload (selaras MAX_IMAGE_SIZE default 5 MB).
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Dokumen SPA: jangan di-cache agar build baru langsung terpakai.
    location = /index.html {
        add_header Cache-Control "no-cache" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'" always;
    }

    # Aset ber-hash dari Vite boleh di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + Sanctum -> php-fpm.
    location ~ ^/(api|sanctum)/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # HTTP_HOST dipakai Laravel/Sanctum untuk mencocokkan SANCTUM_STATEFUL_DOMAINS.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_read_timeout 120s;
    }

    # Health check Laravel.
    location = /up {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_HOST $http_host;
    }

    # File upload publik: dilayani langsung dari volume storage bersama.
    # (alias sudah menangani pemetaan path; tidak perlu try_files.)
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }
}
